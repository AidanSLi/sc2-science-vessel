<!doctype html>
<!--
		The default theme is written into the markup rather than applied from script, so the very
		first painted frame is already the right palette. A theme applied after hydration would
		flash the default surface for a frame on every launch; the root layout then overwrites this
		attribute with the stored choice (see `src/lib/theme.ts`).
	-->
<html lang="en" class="h-full" data-theme="terran">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- No external resources: the app must render identically with no network. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		%sveltekit.head%
	</head>
	<body class="h-full" data-sveltekit-preload-data="hover">
		<div class="h-full">%sveltekit.body%</div>
	</body>
</html>
