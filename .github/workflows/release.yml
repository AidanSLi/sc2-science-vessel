name: release

# Builds the installers for a beta release and attaches them to a GitHub Release.
#
# Cross-compilation is not an option for a Tauri app — it links against the platform's own
# WebKitGTK/WinRT — so one runner per *operating system* is the whole strategy. Linux needs only
# one runner because the bundler emits .deb and .AppImage from a single build; there is no
# separate "Debian runner" and "Arch runner". See docs/packaging.md for why.
#
# Arch and other non-Debian distributions use the AppImage (or an AUR package someone writes
# later). The .deb's dependency names are Debian's, so it will not install on Arch even though the
# binary inside it would run.
on:
  # Manual, so a release is always a deliberate act. The version comes from the tag pushed below
  # rather than from the workflow file, which means no commit is needed to cut a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0-beta.1"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  # Fails fast and cheaply before two 20-minute platform builds are started.
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # The version is read from package.json's `packageManager` field, so it cannot drift from
        # the lockfile's own expectation. Pinning it here as well would be a second place to
        # update and therefore a place to forget.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build the frontend
        run: |
          pnpm check
          pnpm build

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/pyproject.toml

      - name: Run the sidecar test suite
        # `uv run` resolves the sidecar's own pinned dependencies from sidecar/pyproject.toml and
        # manages its virtualenv, so no interpreter setup or pip install is needed here.
        working-directory: sidecar
        run: uv run --group dev pytest

  linux:
    needs: verify
    # 22.04 rather than a newer LTS: glibc compatibility is inherited from the build machine, and
    # building on a newer base silently raises the minimum glibc every user must have.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        # `rpm` is on this list because the bundler *can* emit an .rpm, but it is not in the
        # target list below: an RPM built on Ubuntu is a second-class artefact, and Fedora users
        # are better served by the AppImage until someone builds it on Fedora proper.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libx11-dev \
            patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/pyproject.toml

      - name: Freeze the analysis sidecar
        # Must run before the Tauri build: `externalBin` is resolved at bundle time, so a missing
        # sidecar produces a bundle that installs cleanly and cannot analyse anything. The script
        # names the output for the host target triple, which is the name the bundler looks for.
        run: uv run --with pyinstaller python tools/build_sidecar.py

      - name: Build
        # `--bundles` restricts output to the two formats this project ships. `deb,appimage` is
        # also the local default in tauri.conf.json, so this only makes CI explicit.
        run: pnpm tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/pyproject.toml

      - name: Freeze the analysis sidecar
        run: uv run --with pyinstaller python tools/build_sidecar.py

      - name: Build
        # `nsis` rather than the default `msi`: NSIS produces a single self-contained .exe
        # installer that can be run by any user without an elevated installer service, which is
        # the right default for a beta. Add `msi` here if a managed-deployment artefact is wanted.
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          # Generated on demand rather than maintained by hand: a hand-written changelog in a
          # workflow gets stale, and the commit history is the honest record.
          generate_release_notes: true
          files: artifacts/**
          body: |
            Beta release of sc2-science-vessel.

            **Linux**: use the `.AppImage` on Arch and other non-Debian distributions (chmod +x,
            then run it). The `.deb` is for Debian and Ubuntu. Neither needs an account, and
            neither needs a network connection to analyse a replay.

            **Windows**: run the `.exe` installer.

            Replay analysis is entirely offline. Only the build-order search reaches the network.

            Known limitations in this build: see `docs/packaging.md` and
            `docs/adr/0003-overlay-is-a-native-layer-shell-window.md` for which display servers
            the overlay can stay above a fullscreen game on.
