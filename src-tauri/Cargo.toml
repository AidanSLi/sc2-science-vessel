[package]
name = "sc2-science-vessel"
version = "0.0.0"
description = "Offline StarCraft II replay analysis and build-order coach"
authors = ["AidanSLi"]
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# Tauri 2 wants the app as a library plus a thin binary, so the same code can be driven
# from mobile targets later without restructuring.
name = "sc2_science_vessel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
# Global shortcuts are X11-only on Linux (tauri-apps/tao#1134, #14913), so this plugin is
# the fallback path, not the primary one. The Wayland path is the XDG GlobalShortcuts
# portal, which KDE implements for real (ADR 0008). On Wayland both cannot be active at
# once or one keypress would toggle the overlay twice — see `portal_shortcut`.
tauri-plugin-global-shortcut = "2.4.1"
# Used only to launch the Python analysis sidecar (ADR 0001), never to run player input.
tauri-plugin-shell = "2.5.0"
# The Client API poller reads http://localhost:6119 (ADR 0004). A WebView cannot reach
# loopback without this, and scoping the permission to loopback is far better than a
# blanket HTTP capability.
tauri-plugin-http = "2.8.2"
# The game-start popup needs CRITICAL urgency to be visible over an active fullscreen game.
# `tauri-plugin-notification` cannot express urgency at all (it hard-codes the D-Bus timeout
# and drops every hint but `sound-name`), so notify-rust is used directly for that one call.
# It is also what the plugin itself uses for its payload types on Linux, so this does not add
# a second, parallel notification library to the build.
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
tauri-plugin-notification = "2.7.0"
# Writes the desktop's own autostart entry, so "launch at login" works through the mechanism
# each platform already has rather than an app-specific hack.
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Tauri implements this trait but does not re-export it, and it is the only way to reach the
# platform window handle: the X11 window id on Linux and the Win32 `HWND` on Windows (ADR 0008).
# Must match the 0.6 line Tauri links against, or the trait implementation would not be the same
# trait and the downcast would never match.
raw-window-handle = "0.6"

# The XDG `GlobalShortcuts` portal client, used on Linux to get a compositor-level grab
# instead of the X11 grab that cannot see keypresses while the game holds focus (ADR 0008).
# `async-io` rather than ashpd's default `tokio` backend, so the futures can be driven with
# `futures-lite` on a plain thread and no second async runtime is pulled into an app that
# already has one. Linux-gated because no other platform has this portal.
[target.'cfg(windows)'.dependencies]
# Win32 window enumeration and Z-order control: finding the game window
# (EnumWindows/GetWindowRect) and restacking the overlay directly above it
# (SetWindowPos). Pinned to a specific minor line because this crate makes
# breaking changes between minor versions, unlike most. Pairs with
# raw-window-handle 0.6 to get the Win32 handle out of a Tauri window.
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
futures-lite = "2"
# Reads the game window's rectangle so the overlay can be anchored to it, and finds the
# window to match a changed shortcut against (ADR 0008). Only the connection, property and
# geometry requests are used — no extension, no events.
x11rb = { version = "0.13", default-features = false, features = ["allow-unsafe-code"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
